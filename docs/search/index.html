    // Apply the saved theme before the first paint, so there is no flash of the wrong colours
    (function () {
      var theme = "system";
      try { theme = localStorage.getItem("recipeBook.theme") || "system"; } catch (error) {}

      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.classList.add("js");
    })();
  </script>

<div class="search" data-search>
  <form class="searchbar search__bar" action="/cookbook/search/" method="get" role="search" data-search-form>
    <label class="visually-hidden" for="search-input">Search recipes</label>
    <svg class="icon icon-search searchbar__icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <input id="search-input" class="searchbar__input" type="search" name="q" placeholder="Dish, ingredient, anything…"
      autocomplete="off" enterkeyhint="search" data-search-input>
    <button type="button" class="icon-button searchbar__clear" data-search-clear aria-label="Clear search" hidden><svg class="icon icon-x" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </form>

  <div class="search__toolbar needs-js">
    <button type="button" class="button button--soft search__filter-button" data-open-filters aria-haspopup="dialog">
      <svg class="icon icon-sliders" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Filters</span><span class="count-badge" data-filter-count hidden></span>
    </button>
    <p class="search__summary" data-search-summary aria-live="polite"></p>
  </div>
  <ul class="active-filters" data-active-filters aria-label="Active filters"></ul>

  <div class="search__layout">
    <dialog class="sheet filters-sheet" id="filters-sheet" aria-labelledby="filters-title">
      <div class="sheet__panel" data-sheet-panel>
        <div class="sheet__grip" aria-hidden="true"></div>
        <header class="sheet__header">
          <h2 class="sheet__title" id="filters-title">Filters</h2>
          <button type="button" class="icon-button sheet__close" data-sheet-close aria-label="Close filters"><svg class="icon icon-x" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </header>
        <div class="sheet__body filters" data-filters></div>
        <footer class="sheet__footer filters__footer">
          <button type="button" class="button button--ghost" data-clear-filters>Clear all</button>
          <button type="button" class="button button--primary" data-sheet-close data-show-results>Show recipes</button>
        </footer>
      </div>
    </dialog>

    <div class="search__results">
      <div class="card-grid card-grid--list" data-results aria-busy="false"></div>
      <div class="empty-state" data-no-results hidden>
        <img src="/cookbook/assets/illustrations/no-results.svg" alt="" width="400" height="300">
        <h2>No recipes found</h2>
        <p>Try fewer or different words, or clear some filters.</p>
        <button type="button" class="button button--ghost" data-clear-all>Clear search and filters</button>
      </div>
      <p class="notice" data-search-error hidden></p>
      <noscript>
        <p class="notice">Search needs JavaScript. You can still <a href="/cookbook/recipes/">browse all recipes</a>.</p>
      </noscript>
    </div>
  </div>
</div>
